name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MOON_WORK: "off"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@develop
        with:
          version: ${{ matrix.toolchain }}
          core-version: ${{ matrix.toolchain }}
      - name: moon check
        run: moon check --target all --deny-warn
      - name: test
        run: |
          moon test --target all --deny-warn
          moon test --target all --release --deny-warn
      - name: moon info
        run: |
          moon info --target wasm,wasm-gc,js,native
          git diff --exit-code
      - name: format diff
        run: |
          moon fmt
          git diff --exit-code
  
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@develop
        with:
          version: latest
      - name: test
        run: |
          moon test --enable-coverage
      - name: coverage report
        run: |
          moon coverage report -f summary > coverage_summary.txt
          # Put the coverage report in the pipeline output
          cat coverage_summary.txt >> "$GITHUB_STEP_SUMMARY"
          # We don't use the official coveralls upload tool because it takes >1min to build itself
          moon coverage report \
            -f coveralls \
            -o codecov_report.json \
            --service-name github \
            --service-job-id "$GITHUB_RUN_NUMBER" \
            --service-pull-request "${{ github.event.number }}" \
            --send-to coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      